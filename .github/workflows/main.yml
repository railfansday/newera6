name: Import Berita ke Database

on:
  workflow_dispatch:          # Bisa dijalankan manual
  schedule:
    - cron: '0 */6 * * *'     # Opsional: otomatis tiap 6 jam

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install feedparser requests beautifulsoup4 lxml

      # ===== JALANKAN FILE IMPORT DATABASE ANDA =====
      # Ganti 'import_db_saja.py' dengan nama file yang Anda simpan di GitHub
      - name: Jalankan Import (Scraper)
        run: python hanyadatabase.py

      # ===== COMMIT & PUSH DATABASE KE GITHUB =====
      - name: Commit & Push Database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Memasukkan folder database ke dalam git
          git add database_hasil5/ || true
          
          # Jika tidak ada perubahan artikel baru, berhenti
          git diff --staged --quiet && echo "Tidak ada artikel baru" && exit 0
          
          git commit -m "Update database otomatis [skip ci]"
          git pull --rebase origin main || true
          git push
