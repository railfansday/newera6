name: Scrape & Export Berita

on:
  workflow_dispatch:          # Bisa dijalankan manual
  schedule:
    - cron: '0 */6 * * *'     # Opsional: otomatis tiap 6 jam

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-22.04
    timeout-minutes: 45         # Waktu ditambah karena ada proses export HTML

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install feedparser requests beautifulsoup4 lxml

      # ===== 1. JALANKAN IMPORT (SCRAPER KE DATABASE) =====
      - name: Jalankan Import (Scraper)
        run: python hanyadatabase.py

      # ===== 2. JALANKAN EXPORT (DATABASE KE HTML) =====
      # Pastikan Anda sudah membuat file export.py (kode SEO yang saya berikan)
      - name: Jalankan Export (Generate HTML)
        run: python export.py

      # ===== 3. COMMIT & PUSH SEMUA HASIL =====
      - name: Commit & Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Tambahkan folder database DAN semua file HTML, sitemap, robots
          git add database_hasil5/ *.html *.xml *.txt || true
          
          # Jika tidak ada perubahan, berhenti
          git diff --staged --quiet && echo "Tidak ada perubahan" && exit 0
          
          git commit -m "Update otomatis: Database & HTML [skip ci]"
          git pull --rebase origin main || true
          git push
